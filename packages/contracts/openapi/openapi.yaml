# Root OpenAPI 3.1 document (planning/06 §1–§2). Each SPINE module owns one file under
# ./modules/; this root only wires them together. `just generate` bundles everything into
# gen/openapi.bundle.json — never hand-edit the bundle or gen/**.
openapi: 3.1.0
info:
  title: AI Stylist API
  version: 1.0.0
  description: |
    Public API of the AI Stylist backend. URI-versioned (`/v1`); changes within `v1` are additive.
    Errors are RFC 9457 `application/problem+json` with a stable machine `code` from
    `@ai-stylist/shared-kernel`.
  contact:
    name: AI Stylist engineering
  license:
    name: Proprietary
servers:
  - url: https://api.ai-stylist.app
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: platform
    description: Health, version and other non-domain endpoints
  - name: identity
    description: Sign-in, sessions, account recovery, consent, data export and account deletion
  - name: profile
    description: Profile settings, body measurements, style preferences and onboarding progress
  - name: billing
    description: Resolved entitlements
paths:
  /v1/health:
    $ref: './modules/platform.yaml#/paths/~1v1~1health'
  /v1/version:
    $ref: './modules/platform.yaml#/paths/~1v1~1version'
  /v1/auth/sign-in/social:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1sign-in~1social'
  /v1/auth/sign-up/complete:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1sign-up~1complete'
  /v1/auth/passkey/generate-authenticate-options:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1passkey~1generate-authenticate-options'
  /v1/auth/passkey/verify-authentication:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1passkey~1verify-authentication'
  /v1/auth/passkey/generate-register-options:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1passkey~1generate-register-options'
  /v1/auth/passkey/verify-registration:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1passkey~1verify-registration'
  /v1/auth/get-session:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1get-session'
  /v1/auth/session/refresh:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1session~1refresh'
  /v1/auth/sign-out:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1sign-out'
  /v1/auth/list-sessions:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1list-sessions'
  /v1/auth/revoke-sessions:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1revoke-sessions'
  /v1/auth/sign-in/magic-link:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1sign-in~1magic-link'
  /v1/auth/recovery/complete:
    $ref: './modules/identity.yaml#/paths/~1v1~1auth~1recovery~1complete'
  /v1/me/recovery:
    $ref: './modules/identity.yaml#/paths/~1v1~1me~1recovery'
  /v1/me/consents:
    $ref: './modules/identity.yaml#/paths/~1v1~1me~1consents'
  /v1/me/exports:
    $ref: './modules/identity.yaml#/paths/~1v1~1me~1exports'
  /v1/me/exports/{id}:
    $ref: './modules/identity.yaml#/paths/~1v1~1me~1exports~1{id}'
  /v1/me/deletion:
    $ref: './modules/identity.yaml#/paths/~1v1~1me~1deletion'
  /v1/me/profile:
    $ref: './modules/profile.yaml#/paths/~1v1~1me~1profile'
  /v1/me/measurements:
    $ref: './modules/profile.yaml#/paths/~1v1~1me~1measurements'
  /v1/me/preferences:
    $ref: './modules/profile.yaml#/paths/~1v1~1me~1preferences'
  /v1/me/onboarding-progress:
    $ref: './modules/profile.yaml#/paths/~1v1~1me~1onboarding-progress'
  /v1/me/entitlements:
    $ref: './modules/billing.yaml#/paths/~1v1~1me~1entitlements'
components:
  schemas:
    ProblemDetails:
      $ref: './modules/platform.yaml#/components/schemas/ProblemDetails'
  responses:
    Problem:
      $ref: './modules/platform.yaml#/components/responses/Problem'
  # Operations name schemes by key, not by $ref, so every scheme is wired here.
  securitySchemes:
    bearerAuth:
      $ref: './modules/platform.yaml#/components/securitySchemes/bearerAuth'
    deletionCancelToken:
      $ref: './modules/identity.yaml#/components/securitySchemes/deletionCancelToken'
