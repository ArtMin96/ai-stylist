# Generated Pydantic models from `packages/contracts/events/*.json` (doc 06 §1).
# Regenerate with `just generate` (tools/codegen/gen-python.sh); never edit by hand.
[project]
name = "ai-stylist-generated"
version = "0.1.0"
description = "Pydantic v2 models generated from the canonical event schemas in packages/contracts"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_stylist_generated"]
