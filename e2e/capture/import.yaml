# Library import (capture brief §7, Q17, C21): the system picker, one photo; the same checks run once
# on the still; a dark frame gets the too-dark tip with "Keep anyway" and "Choose another". The
# recipe adds a too-dark frame-set image to the photo library first, so it is the newest photo. The
# system picker is the only platform branch: its photo cells are system UI, not app test IDs.
appId: ${APP_ID}
---
- launchApp
- tapOn:
    id: home-open-capture
- scrollUntilVisible:
    element:
      id: cap-picker-import
- tapOn:
    id: cap-picker-import
- takeScreenshot: 01-system-picker
- runFlow:
    file: subflows/pick-newest-photo.yaml
- extendedWaitUntil:
    visible:
      id: cap-screen-import-tips
    timeout: 8000
- assertVisible:
    id: cap-import-tip-too-dark
- assertVisible:
    id: cap-import-keep-anyway
- takeScreenshot: 02-import-tips
- tapOn:
    id: cap-import-choose-another
- runFlow:
    file: subflows/pick-newest-photo.yaml
- extendedWaitUntil:
    visible:
      id: cap-screen-import-tips
    timeout: 8000
- tapOn:
    id: cap-import-keep-anyway
- assertVisible:
    id: cap-screen-review
- takeScreenshot: 03-import-kept-review
