[project]
name = "ai-stylist-segmentation"
version = "0.1.0"
description = "AI Stylist garment segmentation worker (FastAPI). P02: echo stub."
requires-python = ">=3.14,<3.15"
dependencies = [
  "ai-stylist-generated",
  "fastapi>=0.141.1",
  "pydantic>=2.13.5,<3",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_stylist_segmentation"]

[tool.uv.sources]
ai-stylist-generated = { workspace = true }
