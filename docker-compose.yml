# Local infrastructure for `just dev-api` / `just db-*` (planning/15 §1.4): Postgres 18 with
# pgvector, matching the production PostgreSQL major. Data persists in the named volume; `just db-reset --yes`
# wipes the schema, `docker compose down -v` wipes the volume.
#
# PostgreSQL 18+ images keep data in a versioned subdirectory (PGDATA=/var/lib/postgresql/18/docker)
# and declare the volume at /var/lib/postgresql; a mount at the pre-18 path /var/lib/postgresql/data
# makes the entrypoint refuse to start. The volume was renamed with the 17 -> 18 move so a PG18 server
# never opens an old PG17 volume (`postgres-data`); list it with `docker volume ls` and remove it with
# `docker volume rm <project>_postgres-data` once nothing in it is needed (local synthetic data only).
#
# Host port defaults to 5432; set POSTGRES_HOST_PORT in .env when another Postgres already
# listens there (DATABASE_URL must use the same port).
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ai-stylist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_stylist
      POSTGRES_PASSWORD: ai_stylist
      POSTGRES_DB: ai_stylist
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-cluster:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_stylist -d ai_stylist']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-cluster:
