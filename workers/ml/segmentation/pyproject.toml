[project]
name = "ai-stylist-segmentation"
version = "0.1.0"
description = "AI Stylist garment segmentation worker (FastAPI). P02: echo stub."
requires-python = ">=3.14,<3.15"
dependencies = [
  "ai-stylist-generated",
  # Log redaction, span sanitizer and correlation id, shared by every worker service.
  "ai-stylist-observability",
  "fastapi>=0.141.1",
  # OpenTelemetry (planning/14 §3, ADR-0007): traces over OTLP/HTTP protobuf; started in main.py
  # only when OTEL_EXPORTER_OTLP_ENDPOINT is set. Contrib packages are versioned 0.x bN.
  "opentelemetry-api>=1.45.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.0",
  "opentelemetry-instrumentation-fastapi>=0.66b0",
  "opentelemetry-sdk>=1.45.0",
  "opentelemetry-semantic-conventions>=0.66b0",
  "pydantic>=2.13.5,<3",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_stylist_segmentation"]

[tool.uv.sources]
ai-stylist-generated = { workspace = true }
ai-stylist-observability = { workspace = true }
