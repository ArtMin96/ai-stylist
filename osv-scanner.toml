[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2026-11-10
reason = "decode-uri-component@0.2.2 (pnpm-lock.yaml: expo-router@57.0.20 -> query-string@7.1.3 -> decode-uri-component). The only fixed line (>=0.5.0) is ESM-only (`export default`), while query-string@7 is CommonJS and calls `require('decode-uri-component')(value)`; under Metro/Node CJS interop the require returns a namespace object, so route-path parsing would throw at app runtime. expo-router@57 (latest) still pins query-string ^7. Revisit when expo-router moves off query-string@7 or a CJS-compatible fix is published."
