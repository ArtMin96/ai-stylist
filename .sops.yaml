# sops + age (planning/15 §6). One age recipient per developer + one CI key.
# Onboarding: add your public key below, re-encrypt every secrets/*.enc.yaml, open a PR.
#
# No keys exist yet (P02 T01). Replace the placeholder before encrypting anything:
#   age-keygen -o ~/.config/sops/age/keys.txt   # prints "Public key: age1..."
#
# PLACEHOLDER RECIPIENTS — replace with real age public keys:
#   - age1PLACEHOLDER_DEV_LEAD_PUBLIC_KEY
#   - age1PLACEHOLDER_CI_PUBLIC_KEY
creation_rules:
  - path_regex: secrets/dev\.enc\.yaml$
    key_groups:
      - age:
          - age1PLACEHOLDER_DEV_LEAD_PUBLIC_KEY
          - age1PLACEHOLDER_CI_PUBLIC_KEY
  - path_regex: secrets/staging\.enc\.yaml$
    key_groups:
      - age:
          - age1PLACEHOLDER_DEV_LEAD_PUBLIC_KEY
          - age1PLACEHOLDER_CI_PUBLIC_KEY
  - path_regex: secrets/prod\.enc\.yaml$
    key_groups:
      - age:
          - age1PLACEHOLDER_DEV_LEAD_PUBLIC_KEY
          - age1PLACEHOLDER_CI_PUBLIC_KEY
