# Gradle + AGP settings for apps/android (committed; machine-specific values go in ~/.gradle).
# Sized for a 16 GB machine / the 16 GB GitHub ubuntu runner. Lint + detekt + R8 in one build
# need the 2 GB metaspace (1 GB hit OutOfMemoryError: Metaspace on a full clean run).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# mise is the single JDK source: never let Gradle download toolchains.
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
