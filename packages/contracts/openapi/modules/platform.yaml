# `platform` module contract (docs/modules/platform.md): operational endpoints plus the shared
# components every module references: the RFC 9457 problem schema and responses, the
# `bearerAuth` security scheme, the `Idempotency-Key` / `If-Match` headers, the
# cursor-pagination parameters (doc 06 §2) and the BCP 47 `Locale` tag. Module files `$ref`
# these; they never copy them. A scheme only one module uses lives in that module's file.
# Included from ../openapi.yaml.
openapi: 3.1.0
info:
  title: AI Stylist API — platform
  version: 1.0.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [platform]
      summary: Liveness and dependency health
      description: Returns `ok` when the API and every checked dependency are reachable.
      security: []
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: One or more dependencies are down
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      operationId: getVersion
      tags: [platform]
      summary: Build identity of the running API
      description: Semantic version, commit SHA and build timestamp of the deployed API.
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    HealthReport:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties: false
          required: [db]
          properties:
            db:
              $ref: '#/components/schemas/HealthCheckStatus'
    HealthCheckStatus:
      type: string
      enum: [ok, down]
    VersionInfo:
      type: object
      additionalProperties: false
      required: [version, commit, builtAt]
      properties:
        version:
          type: string
          description: Semantic version of the deployed API
          examples: ['0.1.0']
        commit:
          type: string
          description: Git commit SHA the build was produced from
          examples: ['0123456789abcdef0123456789abcdef01234567']
        builtAt:
          type: string
          format: date-time
          description: RFC 3339 UTC build timestamp
    ProblemDetails:
      type: object
      description: RFC 9457 problem details (planning/06 §2). `code` is stable and machine-readable.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable machine code from the shared-kernel error registry
          pattern: '^[A-Z][A-Z0-9_]+$'
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Field-level validation failures with JSON-pointer paths
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      required: [pointer, message]
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON pointer into the request body
        message:
          type: string
        code:
          type: string
    Locale:
      type: string
      description: BCP 47 language tag, e.g. `en-GB`.
      pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
      maxLength: 35
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Short-lived access token of a session (`SessionGrant.token`, about 15 minutes, doc 11
        §4.2), sent as `Authorization: Bearer <token>` (doc 06 §2). Opaque to clients: never
        parse it. It never renews a session; only the separate refresh token
        (`SessionGrant.refreshToken`) does, through `refreshSession`, and the refresh token is
        never sent in this header. A missing, malformed, expired or revoked access token is
        answered with the `Unauthenticated` (401) problem. The client then renews once with
        `refreshSession`; a refused renewal ends the session on the device.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-generated ULID that makes a mutating request safe to retry (doc 06 §2; the
        mobile mutation-log `opId`). A key is scoped to the caller and the operation: the
        authenticated principal, or for an operation with `security: []` the credential in its
        body (for `requestAccountRecovery`, which carries none, the request hash alone). The
        server keeps key, request hash and response for 48 h: a replay with the same body
        returns the stored response; the same key with a different body is refused with 409
        `IDEMPOTENCY_KEY_REUSED`. Exception: an operation whose answer carries a credential
        (`SessionGrant.token`, `SessionGrant.refreshToken`, `DeletionPending.cancelToken`,
        `SignUpPending.token`) is never answered from the store, and its credential is never
        stored. Such an operation is marked `x-idempotency-replay: never`. A repeated key on it
        is refused with 409 `CONFLICT`, and the client starts that step again. Optional for the
        caller.
      schema:
        type: string
        pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `version` of the resource the client last read, as a quoted integer, e.g. `"3"`
        (doc 06 §2). Every write to a versioned resource sends it; a stale version is refused
        with 409 `VERSION_MISMATCH`.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the `nextCursor` of the previous page; omit for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Page size (doc 06 §2 cursor pagination).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  headers:
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110 §10.2.3, delay-seconds form).
      schema:
        type: integer
        minimum: 0
    CacheControlNoStore:
      description: Always `no-store`; the response must not be stored by any cache.
      schema:
        type: string
        enum: [no-store]
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthenticated:
      description: |
        `UNAUTHENTICATED`: the access token is missing, malformed, expired or revoked. The
        client renews the session once with its refresh token (`refreshSession`); if the renewal
        is refused too, it signs in again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: |
        The caller is authenticated but may not perform this operation. `code` is `FORBIDDEN`
        unless the operation names a more specific code for this status.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: |
        `IDEMPOTENCY_KEY_REUSED` when the `Idempotency-Key` was already used with a different
        request; `VERSION_MISMATCH` when `If-Match` no longer matches the stored version;
        `CONFLICT` otherwise. Exception: on an operation whose answer carries a credential
        (marked `x-idempotency-replay: never`), any repeated `Idempotency-Key` is refused with
        `CONFLICT`, never answered from the store, and the client starts that step again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AccountDeleted:
      description: |
        `ACCOUNT_DELETED`: the account is deleted or its deletion is in progress. The client
        erases everything it stores for the account and returns to its signed-out start; it
        tells this reply from 401 by the status alone. A 410 is cacheable by default
        (RFC 9110 §15.5.11), so the reply carries `Cache-Control: no-store` and must not be
        cached.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: '`RATE_LIMITED`: a rate limit was hit (doc 11 §14); retry after `Retry-After` seconds.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
