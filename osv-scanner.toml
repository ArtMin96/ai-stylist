# osv-scanner ignore list for `just security-scan`.
#
# Policy: docs/security/dependency-ignores.md. Every entry must name the OSV/GHSA id, the
# affected package + dependency path, why it cannot be fixed today, and an `ignoreUntil`
# no later than two months out. osv-scanner re-reports the finding automatically once the
# date passes, so an expired entry fails CI until it is renewed (with a fresh reason) or removed.
#
# Only findings with no fixed version, or where every fix path breaks a tool, belong here.
# Anything with a working fix is bumped or handled via `pnpm.overrides` in package.json.

[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-11-10
reason = "image-size@1.2.1 (pnpm-lock.yaml: expo -> @expo/cli -> metro -> image-size). JXL/HEIF parser DoS. No fixed release: advisory marks every version through 2.0.2 (the latest) as affected. Build-time only (Metro asset resolver on the developer/CI machine); never runs in the app or API. Revisit when image-size publishes a fixed release."

