# PR gate (tier 1): the fast, blocking check on every pull request and every push to main.
# Budget: < 10 min wall clock (AC-1; ci.pr_gate_duration_seconds lands in the job summary, and on a
# push to main the summary job also pushes it to Grafana Cloud as stylist.ci.pr_gate_duration).
#
# Triggers:  pull_request (any path), push to main.
# Recipes:   just ci-parity --core, just generate --check, just clone-check (+ --fixtures), and
#            the [private] CI helpers ci-env-example-check, ci-contracts-spectral,
#            ci-contracts-breaking, ci-pr-gate-metrics (justfile).
# Native apps: the parity job runs `just ci-parity --core` (NATIVE_LANES=none: the iOS and Android
#            lanes print "not selected"), because ios.yml and android.yml run those lanes on their own
#            paths. The contracts job runs the FULL `just generate --check`, so every contract change
#            proves the TS, Python, Swift (Docker swift:6.4) and Kotlin (JDK 25) clients are current.
#            The PR-diff secret scan uses gitleaks/gitleaks-action directly (no recipe needed).
#            The clone-check job runs the gate that `just ci-parity` also runs, as its own check.
# Required secrets: none.
# Optional secrets (steps degrade gracefully when unset):
#   TURBO_TOKEN, TURBO_TEAM   Turborepo remote cache (no Vercel account yet)
#   GITLEAKS_LICENSE          only needed if the repo lives under a GitHub org
#   OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS
#                             Grafana Cloud OTLP, push to main only (pull_request runs never get
#                             them): the summary job pushes stylist.ci.pr_gate_duration and
#                             stylist.ci.pr_gate.runs (dashboard 01, CI row). The headers hold a
#                             CI-only metrics-write token, never the dev token. Unset = a notice,
#                             and a failed push only warns: it never fails the gate
#
# Job tree (roots run in parallel; summary fails when any gate job failed or was cancelled):
#   parity ──────┐
#   contracts ───┤
#   secrets ─────┼──> summary
#   clone-check ─┘
name: pr-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DO_NOT_TRACK: '1'

jobs:
  parity:
    name: Gate · just ci-parity
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-parity-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Turborepo remote cache: only active once the account exists.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Setup · Record start time
        id: start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Setup · Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs-check DC-03 dates module code by git history; a shallow clone fails it
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Setup · Report remote cache status
        run: |
          if [ -n "$TURBO_TOKEN" ] && [ -n "$TURBO_TEAM" ]; then
            echo "Turborepo remote cache: enabled"
          else
            echo "::notice::Turborepo remote cache disabled (TURBO_TOKEN/TURBO_TEAM not set)"
          fi
      - name: Verify · .env.example covers every API env key
        run: just ci-env-example-check
      - name: Verify · Run the PR gate sequence (format, lint, typecheck, arch, clones, docs, generate, test, security)
        run: just ci-parity --core
      - name: Report · Job duration
        if: always()
        run: |
          n=$(( $(date +%s) - ${{ steps.start.outputs.ts }} ))
          echo "ci.pr_gate_duration_seconds=${n}" | tee -a "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Gate · Contracts (generate --check, spectral, oasdiff)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    # A cold codegen cache builds swift-openapi-generator in Docker (about 6 min); warm runs take seconds.
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-contracts-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
        with:
          # oasdiff needs the base ref to diff against.
          fetch-depth: 0
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
      # gen-swift.sh builds its pinned generator into ~/.cache/ai-stylist/swift-codegen and
      # gen-kotlin.sh downloads its sha256-checked generator jar into ~/.cache/ai-stylist.
      - name: Setup · Restore codegen cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ai-stylist
          key: codegen-${{ runner.os }}-${{ hashFiles('tools/codegen/gen-swift.sh', 'tools/codegen/gen-kotlin.sh') }}
      - name: Verify · Generated clients are up to date (TS, Python, Swift, Kotlin)
        run: just generate --check
      - name: Verify · Spectral lint of the OpenAPI sources
        run: just ci-contracts-spectral
      - name: Verify · No breaking changes against the base branch (oasdiff + event schemas)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: just ci-contracts-breaking "$BASE_SHA"

  secrets:
    name: Gate · Secret scan (PR diff)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on the PR
    concurrency:
      group: ${{ github.workflow }}-secrets-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The full-tree scan already runs in `just security-scan` (parity job); this one scans only
      # the commits in the PR range and annotates the diff.
      - name: Verify · gitleaks over the PR commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  clone-check:
    name: Gate · Clone detection
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    # Same budget as the parity job: on a cold cache the setup action installs every pinned tool.
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-clone-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
      - name: Verify · Duplication within the threshold (jscpd, NFR-TEAM-040)
        run: just clone-check
      - name: Verify · Clone fixtures still fail
        run: just clone-check --fixtures

  summary:
    # Whole-run wall clock (all jobs above), the number AC-1 is measured on. Also the single job a
    # branch-protection rule can require once protection is available on this repository.
    name: Report · PR gate summary
    needs: [parity, contracts, secrets, clone-check]
    if: always()
    runs-on: ubuntu-latest
    # The CI-metrics steps add a checkout and a cached node + just install to the old 2 minutes.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ${{ github.workflow }}-summary-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report · Run duration and job results
        id: duration
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          n=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "seconds=${n}" >> "$GITHUB_OUTPUT"
          {
            echo "## PR gate"
            echo ""
            echo "ci.pr_gate_duration_seconds=${n}"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| parity | ${{ needs.parity.result }} |"
            echo "| contracts | ${{ needs.contracts.result }} |"
            echo "| secrets | ${{ needs.secrets.result }} |"
            echo "| clone-check | ${{ needs.clone-check.result }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 600 ]; then
            echo "::warning::PR gate took ${n}s (> 600s budget, AC-1)"
          fi
      # CI metrics (planning/14 §4; dashboard 01, CI row): on a push to main only, this run's
      # duration and one run sample go to Grafana Cloud over OTLP. Pull request runs keep the summary
      # above and push nothing: the OTLP secrets never reach code from a PR checkout. The steps never
      # fail the gate: each continues on error, and the recipe exits 0 without the secrets or when
      # the push fails. The checkout and install run after the duration is taken, so they never
      # count towards it.
      - name: Report · Check out for the CI-metrics push
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/checkout@v7
      - name: Report · Install node and just for the CI-metrics push
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: jdx/mise-action@v4
        with:
          install_args: node just
          cache: true
      - name: Report · Push CI metrics (OTLP; never fails the gate)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}
          DURATION_SECONDS: ${{ steps.duration.outputs.seconds }}
          CONCLUSION: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
        run: just ci-pr-gate-metrics --duration "$DURATION_SECONDS" --conclusion "$CONCLUSION"
      - name: Report · Fail when any gate job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::one or more PR gate jobs failed"
          exit 1
