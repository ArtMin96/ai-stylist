# Android lane: builds and verifies the native Kotlin + Jetpack Compose app in apps/android.
#
# Triggers: pull requests and pushes that touch apps/android/**, packages/contracts/** (the generated
#           Kotlin client and the analytics taxonomy live there), tools/codegen/gen-kotlin.sh or this
#           file; plus manual dispatch.
# Secrets:  none. The release build is unsigned. Play signing (upload keystore) comes later in a
#           separate, tag- or dispatch-only job.
# Recipes:  just android-sdk install · just android-format --check · just android-lint ·
#           just android-detekt · just android-test · just android-build <debug|preview|release>
#           (all go through apps/android/tools/gradle.sh, which checks for JDK 21 and finds the SDK).
# Dependency verification runs inside every Gradle step: apps/android/gradle/verification-metadata.xml
# (sha256) plus STRICT lockfiles, so a changed or unknown artifact fails whichever job resolves it.
#
# Job graph:  verify ──┬──► test
#                      └──► build
name: android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/contracts/**'
      - 'tools/codegen/gen-kotlin.sh'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/contracts/**'
      - 'tools/codegen/gen-kotlin.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions: {}

env:
  CI: 'true'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: Verify (lint · format · detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: android-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install mise tools
        uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Setup · Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Setup · Android SDK
        run: just android-sdk install
      - name: Verify · Spotless
        run: just android-format --check
      - name: Verify · Android Lint
        run: just android-lint
      - name: Verify · detekt
        run: just android-detekt
      - name: Report · Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-verify-reports-${{ github.sha }}
          path: |
            apps/android/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Report · Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Android · Verify: ${JOB_STATUS}"
            echo "- Spotless (ktlint), Android Lint + compose-lint-checks (warnings are errors), module graph, detekt"
            echo "- Dependency verification: verification-metadata.xml (sha256) + STRICT lockfiles"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (unit · Robolectric)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: android-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install mise tools
        uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Setup · Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Setup · Android SDK
        run: just android-sdk install
      - name: Test · Unit + Robolectric
        run: just android-test
      - name: Report · Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            apps/android/**/build/reports/tests/**
            apps/android/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Report · Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Android · Test: ${JOB_STATUS}"
            echo "- JVM unit tests (:core:data, :core:analytics, :app) and Robolectric Compose tests (:feature:home)"
            echo "- Reports: artifact android-test-reports-${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (debug · preview · release)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install mise tools
        uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Setup · Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Setup · Android SDK
        run: just android-sdk install
      - name: Build · Debug APK
        run: just android-build debug
      - name: Build · Preview APK
        run: just android-build preview
      - name: Build · Release (unsigned)
        run: just android-build release
      - name: Report · Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Report · Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Android · Build: ${JOB_STATUS}"
            echo "| Variant | applicationId | Signing |"
            echo "|---|---|---|"
            echo "| debug (dev) | app.aistylist.mobile.dev | debug key |"
            echo "| preview | app.aistylist.mobile.preview | debug key |"
            echo "| release (prod) | app.aistylist.mobile | unsigned |"
            echo "- APKs: artifact android-apks-${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
