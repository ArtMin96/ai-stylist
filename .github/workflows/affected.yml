# Affected-module tier (tier 2): integration tests and migration round-trips against a real
# Postgres+pgvector, run only when a PR touches the API, the database, or the contracts.
# Budget: < 25 min. Required when triggered.
#
# Triggers:  pull_request touching apps/api/**, packages/db/**, packages/contracts/**,
#            pnpm-lock.yaml or this file.
# Recipes:   just test, just db-migrate, just db-rollback, and the [private] CI helper
#            ci-pgvector (justfile).
# Required secrets: none (uses a Postgres+pgvector service container).
# Optional secrets:
#   TURBO_TOKEN, TURBO_TEAM   Turborepo remote cache
#
# Job tree (roots run in parallel):
#   integration ─┐
#   migrations ──┴──> summary
name: affected

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/affected.yml'

permissions:
  contents: read

concurrency:
  group: affected-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DO_NOT_TRACK: '1'
  # Native lanes (apps/ios, apps/android) run in ios.yml and android.yml, not in this tier.
  NATIVE_LANES: none
  # Matches the service container below; Testcontainers-based suites spin up
  # their own pgvector and ignore this.
  DATABASE_URL: postgres://app:app@localhost:5432/app
  PGHOST: localhost
  PGPORT: '5432'
  PGUSER: app
  PGPASSWORD: app
  PGDATABASE: app

jobs:
  integration:
    name: Test · Integration suite (pgvector)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-integration-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        # Local Docker pgvector matching the production PostgreSQL major (brief §1).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Setup · Enable pgvector on the service database
        run: just ci-pgvector
      - name: Test · Full test suite
        run: just test

  migrations:
    name: Test · Migration forward, rollback, re-apply
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-migrations-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Migration forward/rollback runs against the ephemeral service Postgres here; the staging
    # proof runs on a scratch database restored from the staging backup (DEC-43,
    # docs/SERVICES-SETUP.md §3).
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
      - name: Setup · Enable pgvector on the service database
        run: just ci-pgvector
      - name: Test · Apply migrations forward
        run: just db-migrate
      - name: Test · Roll back the last migration (expand-contract aware)
        run: just db-rollback
      - name: Test · Re-apply after rollback (idempotency)
        run: just db-migrate

  summary:
    name: Report · Affected-module summary
    needs: [integration, migrations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-summary-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Report · Job results
        run: |
          {
            echo "## Affected-module tier"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| integration | ${{ needs.integration.result }} |"
            echo "| migrations | ${{ needs.migrations.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report · Fail when any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::one or more affected-module jobs failed"
          exit 1
