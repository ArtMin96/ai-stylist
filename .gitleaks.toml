# gitleaks configuration (P02-T12). Used by the pre-commit hook, `just security-scan`,
# the PR-diff scan in pr-gate.yml, and the full-history scan in nightly.yml.
#
# Extends the default ruleset shipped inside the gitleaks binary (v8.x).
# Syntax reference: gitleaks README "Configuration" (v8.25+ uses [[allowlists]]).
title = "ai-stylist gitleaks config"

[extend]
useDefault = true

# Custom rule: age identity secret keys (sops+age is the secrets backend, 15 §6).
# Format: "AGE-SECRET-KEY-1" + 58 chars of Bech32 upper-case alphabet.
[[rules]]
id = "age-secret-key"
description = "age identity secret key (sops/age private key)"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{58}'''
keywords = ["AGE-SECRET-KEY-1"]
tags = ["key", "age", "sops"]

# Global allowlist: paths that legitimately contain key-shaped strings.
[[allowlists]]
description = "zero-value env template, planning docs, sops-encrypted files, this config"
paths = [
  '''(^|/)\.env\.example$''',
  '''^planning/.*''',
  '''.*\.enc\.yaml$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
]

# Native build caches. `gitleaks dir .` (just security-scan) walks the working tree and does not
# honour .gitignore, so after a local iOS/Android build it scans binary compiler output (e.g.
# SwiftPM *.swiftmodule records under apps/ios/.build/) where a hash can match generic-api-key.
# These directories are machine-generated and gitignored by apps/ios/.gitignore and
# apps/android/.gitignore, so nothing in them can be committed; the git-history scan
# (gitleaks detect / ci-gitleaks-history) still covers everything that is. Scope is path-only (no
# rule is allowlisted) and limited to the build-output directory names under apps/ios/ and
# apps/android/ — source trees, build scripts (build.gradle.kts), build-logic/ and every other
# path stay fully scanned. `(^|/)` keeps it valid for both `gitleaks dir .` and an absolute scan
# root. Proven by scripts/security/gitleaks-fixtures.sh (run by `just ci-parity`).
[[allowlists]]
description = "gitignored native build caches (apps/ios .build/DerivedData, apps/android build/.gradle/.kotlin)"
paths = [
  '''(^|/)apps/ios/([^/]+/)*\.build/''',
  '''(^|/)apps/ios/([^/]+/)*DerivedData/''',
  '''(^|/)apps/android/([^/]+/)*build/''',
  '''(^|/)apps/android/([^/]+/)*\.gradle/''',
  '''(^|/)apps/android/([^/]+/)*\.kotlin/''',
]

# Public age recipients ("age1...") are not secrets; only the AGE-SECRET-KEY rule matters.
[[allowlists]]
description = "age public keys in .sops.yaml are recipients, not secrets"
paths = ['''(^|/)\.sops\.yaml$''']
condition = "AND"
regexTarget = "match"
regexes = ['''^age1[0-9a-z]{58}$''']
