# Git hooks managed by prek (planning/15 §4, §7). Install: just bootstrap
#   (runs: prek install --hook-type pre-commit --hook-type commit-msg)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (block plaintext secrets)

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (Conventional Commits)
        entry: bash -c 'pnpm exec commitlint --edit "$1"' --
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
