# Pinned toolchain for the AI Stylist monorepo (planning/15 §1.2).
# `mise install` reproduces this exactly. Bumps land only via Renovate PRs (15 §9).
# No global node/pnpm/java/python outside mise.
#
# Activate in an interactive shell:   eval "$(~/.local/bin/mise activate zsh)"
# The justfile prepends mise shims to PATH, so `just <recipe>` works without activation.

[tools]
node = "22.23.2"          # active LTS; must match CI
pnpm = "10.34.5"          # also pinned in package.json#packageManager
python = "3.12.14"        # ML workers (workers/), deps via uv
java = "temurin-17.0.20+8" # JDK for the Android Gradle build (apps/android)
just = "1.58.0"           # task runner (root justfile)
uv = "0.12.10"            # Python package manager / lockfile
direnv = "2.37.1"         # .envrc -> .env loading
sops = "3.13.3"           # secrets (with age)
age = "1.3.2"
prek = "0.5.2"            # git hook manager (.pre-commit-config.yaml)
gitleaks = "8.30.1"       # secret scanning (pre-commit + security-scan)
osv-scanner = "2.5.1"     # vulnerability scanning (security-scan)
syft = "1.51.1"           # SBOM generation (security-scan, T12)
git-lfs = "3.8.0"         # assets/3d/** (.gitattributes); `git lfs install --local` in bootstrap
"github:oasdiff/oasdiff" = "1.31.0" # OpenAPI breaking-change detector (contracts lint, T04); not in the core registry
shellcheck = "0.11.0"     # shell lint for scripts/** and tools/**/*.sh (bash 3.2 portability, macOS /bin/bash)

[settings]
# Tools listed here use the mise-idiomatic version files only; no .nvmrc / .python-version drift.
idiomatic_version_file_enable_tools = []
