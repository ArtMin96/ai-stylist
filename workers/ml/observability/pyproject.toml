# Shared log redaction, span sanitizing and correlation id for every worker service
# (planning/11 §8, planning/14 §2-3). Pure library code: each service's `main.py` wires it into
# logging and tracing; nothing here configures a process.
[project]
name = "ai-stylist-observability"
version = "0.1.0"
description = "AI Stylist worker observability: structlog redaction, span sanitizer, correlation id"
requires-python = ">=3.14,<3.15"
dependencies = [
  "ai-stylist-generated",
  "fastapi>=0.141.1",
  "opentelemetry-api>=1.45.0",
  "opentelemetry-sdk>=1.45.0",
  "opentelemetry-semantic-conventions>=0.66b0",
  "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_stylist_observability"]

[tool.uv.sources]
ai-stylist-generated = { workspace = true }
