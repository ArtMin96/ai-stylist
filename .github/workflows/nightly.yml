# Nightly tier (tier 3): the slow, thorough checks that do not fit the PR gate. Non-blocking:
# failures are investigated, never block merges.
#
# Triggers:  schedule 03:00 UTC daily, workflow_dispatch, and workflow_call (pre-release.yml
#            reuses every job below).
# Recipes:   just test, just sbom, just ml-eval, and the [private] CI helpers ci-pgvector,
#            ci-gitleaks-history, ci-osv-source (justfile).
# Required secrets: none.
# Optional secrets (steps degrade gracefully when unset):
#   TURBO_TOKEN, TURBO_TEAM   Turborepo remote cache
#
# Job tree (roots run in parallel; summary only reports, the failed job itself shows red):
#   full-test ────────┐
#   gitleaks-history ─┤
#   osv-scanner ──────┤
#   sbom ─────────────┼──> summary
#   ml-eval ──────────┤
#   expired-flags ────┤
#   maestro ──────────┘
name: nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  DO_NOT_TRACK: '1'
  # Native lanes (apps/ios, apps/android) run in ios.yml and android.yml, not in this tier.
  NATIVE_LANES: none
  DATABASE_URL: postgres://app:app@localhost:5432/app

jobs:
  full-test:
    name: Test · Full test suite (pgvector)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # github.workflow is the caller's name under workflow_call, so pre-release runs get their own group.
    concurrency:
      group: ${{ github.workflow }}-full-test-${{ github.ref }}
      cancel-in-progress: false
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Setup · Enable pgvector on the service database
        run: just ci-pgvector
      - name: Test · Full test suite
        run: just test

  gitleaks-history:
    name: Verify · Secret scan (full history)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-gitleaks-history-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Setup · Check out (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup · Install toolchain
        uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Verify · gitleaks over all refs
        run: just ci-gitleaks-history

  osv-scanner:
    name: Verify · Vulnerability scan (npm, PyPI, Actions)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-osv-scanner-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install toolchain
        uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Verify · osv-scanner over every manifest and lockfile
        run: just ci-osv-source

  sbom:
    name: Build · SBOM (SPDX + CycloneDX)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-sbom-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
      - name: Build · Generate the SBOM into artifacts/sbom/
        run: just sbom
      - name: Report · Upload the SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/sbom/
          retention-days: 90

  ml-eval:
    name: Test · ML eval suites
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-ml-eval-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Setup · Install toolchain and dependencies
        uses: ./.github/actions/setup
        with:
          python: 'true'
      - name: Test · Run the eval suites (exit 2 = not implemented, skipped)
        run: |
          set +e
          just ml-eval
          rc=$?
          set -e
          case "$rc" in
            0) echo "ml-eval passed" ;;
            2) echo "::notice::ml-eval reports NOT IMPLEMENTED (exit 2) - skipped (P02-T17 stub)" ;;
            *) echo "::error::ml-eval failed with exit $rc"; exit "$rc" ;;
          esac

  expired-flags:
    name: Verify · Expired feature flags (placeholder)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-expired-flags-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Verify · Report flags past expiry (NOT IMPLEMENTED, P02-T09)
        run: |
          echo "NOT IMPLEMENTED (P02-T09): flag registry with owner/expiry lands with the logging/lint task"
          echo "::notice::expired-flag report placeholder - registry not present yet"

  maestro:
    name: Test · Maestro E2E (placeholder)
    # needs: none (root of the job tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-maestro-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Setup · Check out
        uses: actions/checkout@v7
      - name: Test · Maestro flows in e2e/ (NOT IMPLEMENTED)
        run: |
          echo "::notice::Maestro skipped: no emulator/simulator lane yet (locally: just ios-e2e on a Mac, just android-e2e with an emulator)"
          echo "NOT IMPLEMENTED: Maestro on an Android emulator / iOS simulator / device farm"

  summary:
    name: Report · Nightly summary
    needs: [full-test, gitleaks-history, osv-scanner, sbom, ml-eval, expired-flags, maestro]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-summary-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Report · Job results
        run: |
          {
            echo "## Nightly tier"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| full-test | ${{ needs.full-test.result }} |"
            echo "| gitleaks-history | ${{ needs.gitleaks-history.result }} |"
            echo "| osv-scanner | ${{ needs.osv-scanner.result }} |"
            echo "| sbom | ${{ needs.sbom.result }} |"
            echo "| ml-eval | ${{ needs.ml-eval.result }} |"
            echo "| expired-flags | ${{ needs.expired-flags.result }} (placeholder) |"
            echo "| maestro | ${{ needs.maestro.result }} (placeholder) |"
          } >> "$GITHUB_STEP_SUMMARY"
