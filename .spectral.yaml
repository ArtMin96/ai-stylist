# OpenAPI lint (planning/06 §9): naming, problem+json errors, operationIds. Runs via
# `pnpm --filter @ai-stylist/contracts lint:openapi` and the PR gate. Warnings fail (--fail-severity=warn).
extends:
  - spectral:oas
rules:
  # spectral:oas ships these as warnings; make them hard failures.
  operation-operationId: error
  operation-operationId-unique: error
  operation-description: off
  oas3-api-servers: error

  # Every operation must have an explicit operationId (client method names derive from it).
  ai-stylist-operation-id-required:
    description: Every operation needs an explicit operationId.
    severity: error
    given: '$.paths[*][get,put,post,delete,patch,options,head,trace]'
    then:
      field: operationId
      function: truthy

  # Every 4xx/5xx (and `default`) response must be RFC 9457 problem+json (doc 06 §2).
  ai-stylist-error-responses-are-problem:
    description: 4xx/5xx/default responses must be application/problem+json (components/responses/Problem).
    severity: error
    given: '$.paths[*][get,put,post,delete,patch,options,head,trace].responses[?(@property == "default" || @property.match(/^[45][0-9]{2}$/))]'
    then:
      field: content.application/problem+json.schema
      function: truthy

  # Every operation must declare at least one error response so clients get a typed Problem.
  ai-stylist-operation-has-error-response:
    description: Operations must declare a default or 4xx/5xx response.
    severity: error
    given: '$.paths[*][get,put,post,delete,patch,options,head,trace]'
    then:
      field: responses
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: [default]
            - not:
                propertyNames:
                  not:
                    pattern: '^[45][0-9]{2}$'
