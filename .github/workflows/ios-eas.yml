# iOS lane A: EAS Build (P02-T14, candidate for ADR-0002 / OQ-04 - Proposed).
# Dispatch-only until the Expo/Apple accounts exist and ADR-0002 is Accepted.
#
# Required secrets (NONE OF THESE EXIST YET - the workflow will fail fast without them):
#   EXPO_TOKEN                          Expo access token (eas build/submit auth)
# Required for the testflight-upload job (job is skipped when any is unset):
#   APP_STORE_CONNECT_API_KEY_ID        App Store Connect API key ID
#   APP_STORE_CONNECT_API_ISSUER_ID     App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY_P8        contents of the AuthKey_<ID>.p8 file
#
# Both jobs run on Linux: EAS builds and submits on Expo's servers, so no
# Xcode / xcrun / Transporter is needed on the runner (brief §4, 05 §7.2).
name: ios-eas

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [dev, preview, prod]
        default: preview
      submit:
        description: Upload the resulting build to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-eas-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  DO_NOT_TRACK: '1'

jobs:
  build:
    name: just mobile-ios-build --cloud eas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROFILE: ${{ inputs.profile }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Record start
        id: start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set - no Expo account exists yet (brief §8 #14)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: just mobile-ios-build --cloud eas --profile ${{ env.PROFILE }}
        run: just mobile-ios-build --cloud eas --profile "$PROFILE"
      - name: Record ci.ios_eas_build_duration_seconds (ADR-0002 data)
        if: always()
        run: |
          n=$(( $(date +%s) - ${{ steps.start.outputs.ts }} ))
          echo "ci.ios_eas_build_duration_seconds=${n} profile=${PROFILE} result=${{ job.status }}" | tee -a "$GITHUB_STEP_SUMMARY"

  testflight-upload:
    # TestFlight upload from Linux via the App Store Connect API (brief §4 "IPA upload").
    #
    # Approach: `eas submit`. It runs on Linux because the upload itself happens
    # on EAS servers; the runner only needs eas-cli and the ASC API key. eas-cli
    # reads the key from these env vars (verified in expo/eas-cli
    # packages/eas-cli/src/credentials/ios/appstore/resolveCredentials.ts):
    #   EXPO_ASC_API_KEY_PATH, EXPO_ASC_KEY_ID, EXPO_ASC_ISSUER_ID
    # Flags verified in packages/eas-cli/src/commands/submit.ts:
    #   --platform --profile --latest --non-interactive
    # Alternative if the IPA is a plain artifact (GHA macOS lane): `fastlane pilot
    # upload --api_key_path key.json --ipa app.ipa`, which needs Apple's Linux
    # Transporter on the runner; kept out of P02 until ADR-0002 picks the lane.
    #
    # TODO(T14): fold this into a `just mobile-ios-submit` recipe (15 §5.1);
    # inline here only so the ADR-0002 comparison can run before that exists.
    name: TestFlight upload (Linux, eas submit)
    needs: build
    if: ${{ inputs.submit }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE: ${{ inputs.profile }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
    steps:
      - name: Require App Store Connect API key secrets
        run: |
          if [ "$HAS_ASC_KEY" != "true" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _KEY_P8 are not all set - no Apple developer account yet"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write ASC API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: eas submit --platform ios --latest
        working-directory: apps/mobile
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: eas submit --platform ios --profile "$PROFILE" --latest --non-interactive
      - name: Remove ASC API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
