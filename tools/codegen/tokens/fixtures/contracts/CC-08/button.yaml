# CC-08 fixture: ../_valid/button.yaml with one defect. primary allows the size medium, whose
# shared size entry {components.button-medium} holds no icon slot (iconSize, iconGap).
id: button
board: C01
name: AppButton

props:
  - name: label
    type: string
    required: true
  - name: leadingIcon
    type: icon
    default: null
  - name: loading
    type: bool
    default: false

variants: [primary, secondary]
sizes: [large, medium, small]
states: [enabled, pressed, focused, disabled, loading]

combinations:
  primary:
    sizes: [large, medium, small]
    states: [enabled, pressed, focused, disabled, loading]
  secondary:
    sizes: [large]
    states: [enabled, pressed, focused, loading]

tokens:
  primary:
    base: '{components.button-primary}'
    states:
      pressed: '{components.button-primary-pressed}'
      focused: '{components.focus-ring}'
      disabled: '{components.button-primary-disabled}'
    sizes:
      large: '{components.button-primary}'
      medium: '{components.button-medium}'
      small: '{components.button-small}'
  secondary:
    base: '{components.button-secondary}'
    states:
      pressed: '{components.button-secondary-pressed}'
      focused: '{components.focus-ring}'
      loading: '{components.button-secondary-loading}'
    sizes:
      large: '{components.button-secondary}'

accessibility:
  role: button
  label: '{props.label}'
  busy: loading
  minTouchTarget: { ios: 44, android: 48 }

gallery:
  label: Fixture label
  include: all

testId: 'ds-{component}-{variant}-{size}-{state}'

approved: 2026-10-20
