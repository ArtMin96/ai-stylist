# detekt, deliberately limited (buildUponDefaultConfig = false): it only covers what Android Lint,
# compose-lint-checks and ktlint cannot see. Formatting is ktlint's job, Compose rules are Lint's.
# Any finding fails the build (failOnSeverity = Info in build-logic QualityConventions.kt).

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  PrintStackTrace:
    active: true

potential-bugs:
  active: true
  DoubleMutabilityForCollection:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExitOutsideMain:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  LateinitUsage:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  UnusedUnaryOperator:
    active: true
  WrongEqualsTypeParameter:
    active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 12
  LongMethod:
    active: true
    allowedLines: 80
  LongParameterList:
    active: true
    allowedFunctionParameters: 7
    allowedConstructorParameters: 8
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    allowedDepth: 4
