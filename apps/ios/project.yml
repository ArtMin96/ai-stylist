# XcodeGen spec: the ONLY definition of the Xcode project. `just ios-project` generates
# apps/ios/AIStylist.xcodeproj from it (gitignored; never edit or commit the .xcodeproj).
# XcodeGen 2.46.0 (pinned in mise.toml, macOS only).
#
# - Build settings live in Config/*.xcconfig (settingPresets: none, so nothing hidden lands here).
# - The app target is thin: App/ only (entry point, composition root, Info.plist, assets, and the
#   Apple-only adapters: the PostHog sink and the DEBUG-only forced crash).
#   Code goes in the local packages: Packages/Core (no UI) and Packages/Features (screens).
# - Adding a file under App/ or a package needs no change here; re-run `just ios-project`.
name: AIStylist

options:
  settingPresets: none
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.0'
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Dev: debug
  Preview: release
  Prod: release

configFiles:
  Dev: Config/Dev.xcconfig
  Preview: Config/Preview.xcconfig
  Prod: Config/Prod.xcconfig

packages:
  Core:
    path: Packages/Core
  Features:
    path: Packages/Features
  # Official PostHog iOS SDK (analytics + error tracking with native crash capture; MIT). Linked by the
  # app target only (App/PostHogAnalyticsSink.swift), so Core and Features stay Linux-buildable.
  # Pinned exactly: tag 3.85.0 = commit 3b6cd1f873cbcdfc654d93c53c69f61d8dde64d0 (2026-09-26). It has
  # no remote runtime dependencies (the crash reporter, PHPLCrashReporter, is vendored), so this pin is
  # the whole graph. Its build-tools/upload-symbols.sh uploads dSYMs (scripts/xcode.sh, after a build).
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.85.0

targets:
  AIStylist:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Core
        products: [AppConfig, Analytics, AppServices, APIData]
      - package: Features
        products: [HomeFeature]
      - package: PostHog
        products: [PostHog]

schemes:
  AIStylist-Dev:
    build:
      targets:
        AIStylist: all
    run:
      config: Dev
    test:
      config: Dev
      gatherCoverageData: true
      targets:
        - package: Core/AppConfigTests
        - package: Core/AnalyticsTests
        - package: Core/APIDataTests
        - package: Features/HomeModelTests
    profile:
      config: Preview
    analyze:
      config: Dev
    archive:
      config: Dev
  AIStylist-Preview:
    build:
      targets:
        AIStylist: all
    run:
      config: Preview
    test:
      config: Preview
    profile:
      config: Preview
    analyze:
      config: Preview
    archive:
      config: Preview
  AIStylist-Prod:
    build:
      targets:
        AIStylist: all
    run:
      config: Prod
    test:
      config: Prod
    profile:
      config: Prod
    analyze:
      config: Prod
    archive:
      config: Prod
