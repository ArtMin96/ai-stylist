# AppIcon: the glyph contract for canvas board C02 (DESIGN.md "### Icons (C02)").
# This file is the master for the icon set's names and path data; DESIGN.md is the master for the
# icon sizes and strokes (components.icon-<n>), so no glyph holds a size, stroke width or colour.
# Field rules: README.md beside this file ("Icon sets").
# Sources: C02 (84 glyphs in 6 sets), every screen on page 6 (SC01-SC15), the prototype on page 7
# (P01-P18) and page 8 (SE1, SE2, AV1, AV2, TR1, TR2). A concept no screen draws comes from the
# component board that draws it (C01, C03-C10). Measured from the canvas copies of 2026-10-20.
# Owner decisions (2026-10-20, in chat):
# 1. Outfits use thumbs-up and thumbs-down for like and dislike, as the Today action row draws
#    them; the "a pairing you liked" chip and the Liked history follow. Clothing items use a heart
#    for favourite. The star stays only for the "Style preferences" row.
# 2. The AI spark sits only beside "AI-generated preview". Discover's trend tags use the plain tag.
# 3. The five tab icons (today, closet, capture, discover, you) are C02 glyphs inside the native tab
#    bar on both apps (DEC-87). Back and close in native navigation bars stay the system's own; the
#    C02 back and close are for custom headers only (camera, onboarding).
# 4. Every drawn icon is built now, the page-8 selfie, avatar and try-on icons included.
# Owner decisions (2026-10-20, in chat, on this contract's open choices):
# 5. One drawing per meaning. Where the screens tie, the drawing nearest C02 wins; the small
#    visual changes this makes on the screens (the merges, the confidence bars, the stroke and
#    detail changes listed in the comments below) are accepted.
# 6. Credits are the coin stack (TR1); TR2's two rings change.
# 7. The "You follow" chip on SC15 keeps the heart.
# 8. The four-point sparkle on the upsell cards (SC11, TR2) stays; it is not the AI spark.
# Standing rule (owner 2026-10-19, design-system.md invariant 8): where C02 and the screens
# disagree, the screens and prototype win, and screen-only icons join the set. Where the screens
# disagree with each other, the drawing on the most boards wins; on a tie, the drawing nearest C02
# wins (decision 5). Each such choice is a "Screens win:" comment on its glyph.
# Kept and dropped: a C02 glyph stays while a screen, prototype frame, page-8 board or component
# board still draws its concept once the decisions apply. The weather glyphs snow, cold and hot
# stay because the condition chips in DESIGN.md (condition-snow, -cold, -hot) show icon + words.
# Dropped (no board draws them): partly cloudy, umbrella, location, top, trousers, dress, shoe,
# bag, watch, favourite filled (the filled star), visibility.
# Path data: every circle, rect and ellipse is one d string that starts at 3 o'clock and runs
# clockwise, as SVG draws it. An element drawn with fill and no stroke is paint: fill; with fill
# and the inherited stroke, paint: both. A per-bar colour or a stroke-opacity on the board belongs
# to the host (see the confidence glyphs and processing); a glyph has one tint.
# Not in this set: the C10 garment art; the SC02 body-shape figures (24 x 32 option-card art); the
# C04 progress ring (44 viewBox); system chrome (DEC-87).
id: icon
board: C02
name: AppIcon
kind: icon-set
approved: 2026-10-20

accessibility:
  # Hidden from screen readers; the host control names the action ("Back", "Close", "More options
  # for this outfit"). An icon that carries meaning alone sits next to its words (R4).
  role: decorative

gallery:
  title: Icons

# One DESIGN.md token per size the screens draw: components.icon-<n> holds the size and its stroke
# in viewBox units (rendered width = strokeWidth x size / 24).
sizes:
  - icon-11
  - icon-12
  - icon-14
  - icon-16
  - icon-18
  - icon-20
  - icon-22
  - icon-24
  - icon-26
  - icon-28
  - icon-32
  - icon-36
  - icon-40
  - icon-56
defaultSize: icon-24

