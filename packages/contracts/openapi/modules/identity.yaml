# `identity` module contract (docs/modules/identity.md): sign-in, sessions, account recovery, the
# consent registry, the data export and account deletion (export and deletion: owner decision
# 2026-10-13). Included from ../openapi.yaml.
#
# `/v1/auth/*` is served by better-auth 1.7.12 with `@better-auth/passkey` 1.7.12, mounted at
# basePath `/v1/auth` inside `identity` (doc 11 §4.1). Paths are the library's own. The bodies
# describe this API's wire shape, not the library's types: where they differ (problem+json
# errors, the sign-in outcomes, the paginated device list) the identity mount shapes the reply.
# `completeSignUp` and `DELETE /v1/me/recovery` have no library path and are identity's own.
# Sign-in is Apple, Google or a passkey; nothing here accepts a secret typed by the person
# (DEC-64).
openapi: 3.1.0
info:
  title: AI Stylist API — identity
  version: 1.0.0
paths:
  /v1/auth/sign-in/social:
    post:
      operationId: signInWithIdToken
      tags: [identity]
      summary: Sign in with an Apple or Google identity token
      description: |
        The app runs the provider's native sign-in and sends the identity token it received.
        The server verifies the token with the provider's keys, then answers with one
        `SignInResult`: a session for an existing account, `sign_up_required` for an identity
        with no account (nothing is stored until `completeSignUp` accepts the birth year), or
        `deletion_pending` for an account inside its deletion grace window (no session). No
        provider token is ever returned.
      security: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdTokenSignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/SignInAnswer'
        '401':
          $ref: '#/components/responses/SignInRefused'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/sign-up/complete:
    post:
      operationId: completeSignUp
      tags: [identity]
      summary: Complete a pending sign-up with the self-declared birth year (age gate)
      description: |
        Second part of a sign-up. The first part is a sign-in whose answer was
        `sign_up_required`; the `signUpToken` of that answer authorizes this call. The server
        applies the age gate (16+, DEC-60) to the birth year. Accepted: the account is created
        and the answer is the `session` outcome. Refused: `AGE_GATE_FAILED`, nothing about the
        attempt is stored, and the sign-up token is spent; a new attempt starts again with a
        sign-in. Identity's own operation: better-auth 1.7.12 has no path for it.
      security: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignUpRequest'
      responses:
        '200':
          $ref: '#/components/responses/SignInAnswer'
        '401':
          description: '`UNAUTHENTICATED`: the sign-up token is missing, expired, already spent or unknown. Start again with a sign-in.'
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '403':
          description: |
            `AGE_GATE_FAILED`: the birth year lies fewer than 16 years back (DEC-60). Terminal
            for this attempt: nothing is stored and the sign-up token is spent. The client shows
            its refusal screen and offers no way to change the year.
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/passkey/generate-authenticate-options:
    get:
      operationId: getPasskeySignInOptions
      tags: [identity]
      summary: WebAuthn options for a passkey sign-in
      description: |
        Returns a fresh challenge and the WebAuthn request options (W3C WebAuthn
        `PublicKeyCredentialRequestOptionsJSON`) for the platform passkey API. Without a session
        no credentials are listed, so the device offers its discoverable passkeys.
      security: []
      responses:
        '200':
          description: WebAuthn request options
          headers:
            Cache-Control:
              $ref: './platform.yaml#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRequestOptions'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/passkey/verify-authentication:
    post:
      operationId: signInWithPasskey
      tags: [identity]
      summary: Sign in with a passkey assertion
      description: |
        Verifies the assertion the platform passkey API returned for the challenge of
        `getPasskeySignInOptions`. Answers `session`, or `deletion_pending` for an account inside
        its deletion grace window. A passkey always belongs to an existing account, so this
        operation never answers `sign_up_required`.
      security: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeySignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/SignInAnswer'
        '401':
          $ref: '#/components/responses/SignInRefused'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/passkey/generate-register-options:
    get:
      operationId: getPasskeyRegistrationOptions
      tags: [identity]
      summary: WebAuthn options to add a passkey to the signed-in account
      description: |
        Returns a fresh challenge and the WebAuthn creation options (W3C WebAuthn
        `PublicKeyCredentialCreationOptionsJSON`). The account's existing passkeys are listed as
        excluded credentials. Needs a recently created session (better-auth `freshAge`);
        otherwise 403 `FORBIDDEN`, and the client signs in again first.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: WebAuthn creation options
          headers:
            Cache-Control:
              $ref: './platform.yaml#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './platform.yaml#/components/responses/Forbidden'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/passkey/verify-registration:
    post:
      operationId: registerPasskey
      tags: [identity]
      summary: Add a passkey to the signed-in account
      description: |
        Verifies the attestation the platform passkey API returned for the challenge of
        `getPasskeyRegistrationOptions` and stores the passkey on the caller's account. An
        account may hold several passkeys. Opens no new session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationRequest'
      responses:
        '200':
          description: The stored passkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeySummary'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './platform.yaml#/components/responses/Forbidden'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/get-session:
    get:
      operationId: getSession
      tags: [identity]
      summary: Read the current session
      description: |
        The account and expiry of the session the bearer token belongs to. Read-only: it does
        not extend the session (better-auth `deferSessionRefresh`). A token with no live session
        is answered with 401, never with an empty body.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current session
          headers:
            Cache-Control:
              $ref: './platform.yaml#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
    post:
      operationId: refreshSession
      tags: [identity]
      summary: Renew the current session
      description: |
        Extends the session the bearer token belongs to and answers with its token and new
        expiry. The answer may carry a different token than the one presented: the client
        stores the returned token and discards the old one. A 401 here is a refused renewal:
        the client ends the session on the device and sends no further call for it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The renewed session
          headers:
            Cache-Control:
              $ref: './platform.yaml#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrant'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [identity]
      summary: Sign out this device
      description: Revokes the session the bearer token belongs to on the server.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The session is revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignOutResult'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/list-sessions:
    get:
      operationId: listDeviceSessions
      tags: [identity]
      summary: List the signed-in devices of the caller
      description: |
        One entry per active session of the caller's account (the device list, doc 11 §4.2),
        newest first, cursor-paginated (doc 06 §2). Never another user's sessions and never a
        session token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/Cursor'
        - $ref: './platform.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the caller's sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSessionPage'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/revoke-sessions:
    post:
      operationId: signOutAllDevices
      tags: [identity]
      summary: Sign out every device
      description: Revokes every session of the caller's account, the current one included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Every session of the account is revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResult'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/sign-in/magic-link:
    post:
      operationId: requestAccountRecovery
      tags: [identity]
      summary: Ask for an account-recovery link by email
      description: |
        Fallback for a person who lost their passkeys (doc 11 §15). The answer is the same
        status and body whether or not an account exists for the address, so it discloses
        nothing. When one exists, a single-use link is emailed; it works from 24 to 48 hours
        after the request, and any signed-in session of the account can cancel it before then
        (`cancelAccountRecovery`). Never creates an account.
      security: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: Accepted (uniform for every address)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryRequestAccepted'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/auth/magic-link/verify:
    get:
      operationId: completeAccountRecovery
      tags: [identity]
      summary: Use an account-recovery link
      description: |
        Exchanges the token of a recovery link for a sign-in. Refused before 24 hours and from
        48 hours after the request, after a cancel, and on a second use. The person then adds
        a new passkey with `registerPasskey`. The server never logs the query string of this
        path.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Single-use token from the emailed link.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        '200':
          $ref: '#/components/responses/SignInAnswer'
        '401':
          description: '`UNAUTHENTICATED`: the link is unknown, used, cancelled, not yet valid or expired.'
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/me/recovery:
    delete:
      operationId: cancelAccountRecovery
      tags: [identity]
      summary: Cancel a pending account recovery
      description: |
        Cancels the pending recovery link of the caller's account during its 24-hour delay.
        Only a signed-in session of that account can cancel; holding the mailbox is not
        enough. Identity's own operation: better-auth 1.7.12 has no path for it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The pending recovery is cancelled; its link no longer works.
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '404':
          description: '`NOT_FOUND`: the account has no pending recovery.'
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/me/consents:
    get:
      operationId: listConsents
      tags: [identity]
      summary: The caller's current consent per purpose
      description: |
        The latest consent record of each purpose the caller has decided on, cursor-paginated.
        A purpose with no record is absent and its default applies (doc 11 §7.2). The full
        append-only history is part of the data export.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/Cursor'
        - $ref: './platform.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of current consent records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentPage'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
    post:
      operationId: recordConsent
      tags: [identity]
      summary: Grant or withdraw consent for one purpose
      description: |
        Appends a consent record for one purpose (doc 11 §7.1; append-only: a withdrawal is a
        new record). 201 when a record was appended. 200 when the request repeats the current
        state for the same policy version: nothing is stored and the current record, with its
        original dates, is returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentChange'
      responses:
        '200':
          description: Unchanged; the current record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '201':
          description: The appended record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '403':
          description: |
            `CONSENT_REQUIRED`: a withdrawal of `core_service` is refused. This consent is
            required to use the app (doc 11 §7.2). Deleting the account is what ends this
            processing (`POST /v1/me/deletion`).
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/me/exports:
    post:
      operationId: requestDataExport
      tags: [identity]
      summary: Request an export of the caller's data
      description: |
        Starts an asynchronous export of the caller's data (doc 11 §13.1), open on every plan
        (`data.export`). Answers at once with the new export `in_progress`; the client reads it
        with `getDataExport` until it is `ready` (a notification follows as well). One export
        runs at a time per account: while one is in progress, a new request is refused with 429
        and the running export.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The export is accepted and in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: '#/components/responses/DataExportLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/me/exports/{id}:
    get:
      operationId: getDataExport
      tags: [identity]
      summary: Read one of the caller's data exports
      description: |
        The state of an export. While it is `ready`, every read mints a new download link after
        the same authorization check; the link lives at most 10 minutes (DEC-44, doc 11 §5.4).
        The archive itself is kept until `availableUntil`. Never cached.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DataExportId'
      responses:
        '200':
          description: The export
          headers:
            Cache-Control:
              $ref: './platform.yaml#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '404':
          description: '`NOT_FOUND`: the caller has no export with this id.'
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
  /v1/me/deletion:
    post:
      operationId: requestAccountDeletion
      tags: [identity]
      summary: Request deletion of the caller's account
      description: |
        Starts the deletion of the caller's account (doc 11 §13.2). At once every session of the
        account is revoked, this one included, and a sign-in opens no session; the account is
        kept for a 7-day grace window (DEC-65). A sign-in during the window answers
        `deletion_pending`, whose cancel credential can stop the deletion
        (`cancelAccountDeletion`). After the window the purge runs and cannot be stopped.
        Re-authentication (doc 02 §11.3): needs a recently created session (better-auth
        `freshAge`); otherwise 403 `FORBIDDEN`, and the client signs in again first. After the
        answer the token of this request no longer works and the client returns to its
        signed-out start. Deleting the account does not cancel a store subscription.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The deletion is requested; its grace window has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
        '401':
          $ref: './platform.yaml#/components/responses/Unauthenticated'
        '403':
          description: |
            `FORBIDDEN`: the session was not created recently enough to confirm it is the person.
            The client signs in again with the same account and repeats the request.
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          $ref: './platform.yaml#/components/responses/AccountDeleted'
        '429':
          description: |
            `RATE_LIMITED`: the account requested a deletion within the last 30 days (doc 11
            §14), or another rate limit was hit; retry after `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: './platform.yaml#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
    delete:
      operationId: cancelAccountDeletion
      tags: [identity]
      summary: Cancel the account deletion inside its grace window
      description: |
        Stops a pending account deletion during its 7-day grace window (DEC-65). The only
        credential accepted is the cancel credential of the `deletion_pending` sign-in outcome
        (`deletionCancelToken`); the caller holds no session, because the deletion revoked them
        all. The account is active again, but no session is opened or restored: the client signs
        in again. Once the window has ended the cancel is refused with 410 `ACCOUNT_DELETED`.
      security:
        - deletionCancelToken: []
      parameters:
        - $ref: './platform.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The deletion is cancelled and the account is active; sign in to open a session.
        '401':
          description: |
            `UNAUTHENTICATED`: the cancel credential is missing, malformed or expired. The client
            signs in again; during the window that sign-in answers `deletion_pending` with a new
            credential.
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '404':
          description: '`NOT_FOUND`: the account has no pending deletion, e.g. it was already cancelled.'
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '409':
          $ref: './platform.yaml#/components/responses/Conflict'
        '410':
          description: |
            `ACCOUNT_DELETED`: the grace window has ended, so the deletion can no longer be
            cancelled; the account is deleted or being purged. The client erases everything it
            stores for the account and returns to its signed-out start. Not cached.
          headers:
            Cache-Control:
              $ref: './platform.yaml#/components/headers/CacheControlNoStore'
          content:
            application/problem+json:
              schema:
                $ref: './platform.yaml#/components/schemas/ProblemDetails'
        '429':
          $ref: './platform.yaml#/components/responses/RateLimited'
        default:
          $ref: './platform.yaml#/components/responses/Problem'
components:
  responses:
    DataExportLimited:
      description: |
        `RATE_LIMITED`: an export of this account is already in progress, and `current` is that
        export (read it with `getDataExport`); or another rate limit was hit, without `current`.
        Retry after `Retry-After` seconds (doc 11 §14).
      headers:
        Retry-After:
          $ref: './platform.yaml#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DataExportInProgress'
    SignInAnswer:
      description: The outcome of a sign-in (see `SignInResult`)
      headers:
        Cache-Control:
          $ref: './platform.yaml#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignInResult'
    SignInRefused:
      description: '`UNAUTHENTICATED`: the identity token or passkey assertion was not accepted.'
      content:
        application/problem+json:
          schema:
            $ref: './platform.yaml#/components/schemas/ProblemDetails'
  schemas:
    UserId:
      type: string
      description: Account id, a prefixed ULID (`usr_`, shared-kernel `ID_PREFIXES.user`).
      pattern: '^usr_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: ['usr_01J9Z3K8X2Q7N5V4B6C8D0E1F2']
    ConsentRecordId:
      type: string
      description: Consent record id, a prefixed ULID (`cns_`, shared-kernel `ID_PREFIXES.consentRecord`).
      pattern: '^cns_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: ['cns_01J9Z3K8X2Q7N5V4B6C8D0E1F3']
    Base64Url:
      type: string
      description: Base64url without padding (RFC 4648 §5), as WebAuthn JSON encodes binary values.
      pattern: '^[A-Za-z0-9_-]*$'
    IdentityProvider:
      type: string
      description: Identity providers that sign in with a native identity token (DEC-64).
      enum: [apple, google]
    IdTokenSignInRequest:
      type: object
      additionalProperties: false
      required: [provider, idToken]
      properties:
        provider:
          $ref: '#/components/schemas/IdentityProvider'
        idToken:
          type: object
          additionalProperties: false
          required: [token]
          properties:
            token:
              type: string
              minLength: 1
              description: The provider's identity token (a JWT), verified against the provider's keys.
            nonce:
              type: string
              minLength: 1
              description: |
                The unhashed nonce the app generated for the provider request. The identity
                token's `nonce` claim must equal it or its SHA-256 digest. Sign in with Apple
                requires it.
            user:
              type: object
              additionalProperties: false
              description: Name the provider reports to the app on the first authorization only (Sign in with Apple).
              properties:
                name:
                  type: object
                  additionalProperties: false
                  properties:
                    firstName:
                      type: string
                      maxLength: 100
                    lastName:
                      type: string
                      maxLength: 100
    CompleteSignUpRequest:
      type: object
      additionalProperties: false
      required: [signUpToken, birthYear]
      properties:
        signUpToken:
          type: string
          minLength: 1
          description: '`SignUpPending.token` of the `sign_up_required` answer.'
        birthYear:
          type: integer
          description: |
            Self-declared birth year (DEC-60). Only a sanity range is enforced here; the age
            floor is the server's rule and is never restated by a client.
          minimum: 1900
          maximum: 2100
    SignInResult:
      type: object
      description: |
        One sign-in outcome. `outcome` names it, and exactly the object of that outcome is
        present: `session` for `session`, `deletionPending` for `deletion_pending`, `signUp` for
        `sign_up_required`. Only `session` opens a session.
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [session, deletion_pending, sign_up_required]
        session:
          $ref: '#/components/schemas/SessionGrant'
        deletionPending:
          $ref: '#/components/schemas/DeletionPending'
        signUp:
          $ref: '#/components/schemas/SignUpPending'
    SessionGrant:
      type: object
      description: A session the server opened or renewed.
      required: [userId, token, expiresAt]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        token:
          type: string
          minLength: 1
          description: The session token for `bearerAuth`. Kept in the Keychain or Keystore-backed storage only (doc 11 §4.2).
        expiresAt:
          type: string
          format: date-time
          description: |
            When the session ends unless renewed with `refreshSession`. The server may refuse
            the token earlier (revocation, or a shorter access window, doc 11 §4.2); the client
            then renews once.
    SessionInfo:
      type: object
      description: The current session, without its token.
      required: [userId, expiresAt]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        expiresAt:
          type: string
          format: date-time
        needsRefresh:
          type: boolean
          description: True when the server asks the client to renew now with `refreshSession`.
    DeletionPending:
      type: object
      description: |
        The account is inside its 7-day deletion grace window (DEC-65): no session was opened.
        The only thing the client can do is offer to cancel the deletion with `cancelToken`.
      required: [graceEndsAt, cancelToken, cancelTokenExpiresAt]
      properties:
        graceEndsAt:
          type: string
          format: date-time
          description: End of the grace window; the purge starts after it.
        cancelToken:
          type: string
          minLength: 1
          description: Value for the `Deletion-Cancel-Token` header (`deletionCancelToken`); valid only for `DELETE /v1/me/deletion`.
        cancelTokenExpiresAt:
          type: string
          format: date-time
          description: At most 15 minutes after issue (doc 11 §4.2).
    SignUpPending:
      type: object
      description: |
        The verified identity has no account. Nothing is stored. The client asks for the birth
        year and calls `completeSignUp` with `token`.
      required: [token, expiresAt]
      properties:
        token:
          type: string
          minLength: 1
          description: |
            Sign-up credential for `CompleteSignUpRequest.signUpToken`. Single use, valid only
            for `completeSignUp`; it opens no session and grants nothing else.
        expiresAt:
          type: string
          format: date-time
          description: At most 15 minutes after issue.
    SignOutResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    RevokeSessionsResult:
      type: object
      required: [status]
      properties:
        status:
          type: boolean
    DeviceSession:
      type: object
      description: One signed-in device of the caller. Carries no token and no IP address.
      required: [current, createdAt, lastActiveAt, expiresAt]
      properties:
        current:
          type: boolean
          description: True for the session that made this request.
        createdAt:
          type: string
          format: date-time
          description: When the device signed in.
        lastActiveAt:
          type: string
          format: date-time
          description: Last renewal of the session.
        expiresAt:
          type: string
          format: date-time
        userAgent:
          type: string
          maxLength: 512
          description: The `User-Agent` the device sent at sign-in, to tell devices apart.
    DeviceSessionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSession'
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    RecoveryRequestAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: boolean
          description: Always true, whether or not an account exists for the address.
    PasskeyCredentialDescriptor:
      type: object
      description: W3C WebAuthn `PublicKeyCredentialDescriptorJSON`.
      required: [id, type]
      properties:
        id:
          $ref: '#/components/schemas/Base64Url'
        type:
          type: string
          enum: [public-key]
        transports:
          type: array
          items:
            type: string
    PasskeyRequestOptions:
      type: object
      description: W3C WebAuthn `PublicKeyCredentialRequestOptionsJSON`.
      required: [challenge]
      properties:
        challenge:
          $ref: '#/components/schemas/Base64Url'
        timeout:
          type: integer
          minimum: 0
        rpId:
          type: string
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredentialDescriptor'
        userVerification:
          type: string
          enum: [required, preferred, discouraged]
        hints:
          type: array
          items:
            type: string
        extensions:
          $ref: '#/components/schemas/PasskeyExtensionInputs'
    PasskeyCreationOptions:
      type: object
      description: W3C WebAuthn `PublicKeyCredentialCreationOptionsJSON`.
      required: [rp, user, challenge, pubKeyCredParams]
      properties:
        rp:
          type: object
          required: [name]
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          required: [id, name, displayName]
          properties:
            id:
              $ref: '#/components/schemas/Base64Url'
            name:
              type: string
            displayName:
              type: string
        challenge:
          $ref: '#/components/schemas/Base64Url'
        pubKeyCredParams:
          type: array
          items:
            type: object
            required: [type, alg]
            properties:
              type:
                type: string
                enum: [public-key]
              alg:
                type: integer
        timeout:
          type: integer
          minimum: 0
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredentialDescriptor'
        authenticatorSelection:
          type: object
          properties:
            authenticatorAttachment:
              type: string
              enum: [platform, cross-platform]
            residentKey:
              type: string
              enum: [discouraged, preferred, required]
            requireResidentKey:
              type: boolean
            userVerification:
              type: string
              enum: [required, preferred, discouraged]
        attestation:
          type: string
          enum: [none, indirect, direct, enterprise]
        hints:
          type: array
          items:
            type: string
        extensions:
          $ref: '#/components/schemas/PasskeyExtensionInputs'
    PasskeyExtensionInputs:
      type: object
      description: |
        WebAuthn extension inputs (`AuthenticationExtensionsClientInputsJSON`). Only the
        extensions this API requests are modelled.
      properties:
        credProps:
          type: boolean
    PasskeyExtensionOutputs:
      type: object
      description: |
        WebAuthn extension outputs (`AuthenticationExtensionsClientOutputsJSON`). Only the
        extensions this API reads are modelled; send `{}` when there are none.
      properties:
        credProps:
          type: object
          properties:
            rk:
              type: boolean
    PasskeyAuthenticationResponse:
      type: object
      description: W3C WebAuthn `AuthenticationResponseJSON`.
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id:
          $ref: '#/components/schemas/Base64Url'
        rawId:
          $ref: '#/components/schemas/Base64Url'
        type:
          type: string
          enum: [public-key]
        authenticatorAttachment:
          type: string
          enum: [platform, cross-platform]
        clientExtensionResults:
          $ref: '#/components/schemas/PasskeyExtensionOutputs'
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          properties:
            clientDataJSON:
              $ref: '#/components/schemas/Base64Url'
            authenticatorData:
              $ref: '#/components/schemas/Base64Url'
            signature:
              $ref: '#/components/schemas/Base64Url'
            userHandle:
              $ref: '#/components/schemas/Base64Url'
    PasskeyRegistrationResponse:
      type: object
      description: W3C WebAuthn `RegistrationResponseJSON`.
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id:
          $ref: '#/components/schemas/Base64Url'
        rawId:
          $ref: '#/components/schemas/Base64Url'
        type:
          type: string
          enum: [public-key]
        authenticatorAttachment:
          type: string
          enum: [platform, cross-platform]
        clientExtensionResults:
          $ref: '#/components/schemas/PasskeyExtensionOutputs'
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON:
              $ref: '#/components/schemas/Base64Url'
            attestationObject:
              $ref: '#/components/schemas/Base64Url'
            authenticatorData:
              $ref: '#/components/schemas/Base64Url'
            transports:
              type: array
              items:
                type: string
            publicKeyAlgorithm:
              type: integer
            publicKey:
              $ref: '#/components/schemas/Base64Url'
    PasskeySignInRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response:
          $ref: '#/components/schemas/PasskeyAuthenticationResponse'
    PasskeyRegistrationRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response:
          $ref: '#/components/schemas/PasskeyRegistrationResponse'
        name:
          type: string
          maxLength: 100
          description: Label the person gives the passkey.
    PasskeySummary:
      type: object
      description: A passkey stored on the account. Carries no key material.
      required: [createdAt]
      properties:
        name:
          type: string
          maxLength: 100
        createdAt:
          type: string
          format: date-time
    ConsentPurpose:
      type: string
      description: |
        Consent purpose keys of doc 11 §7.2, in that order. Mirrors shared-kernel
        `CONSENT_PURPOSES` value for value (pinned by packages/contracts/tests/kernel-enums.test.ts).
      enum:
        - core_service
        - face_processing
        - location_precise
        - analytics
        - ai_generative
        - notifications
        - training_data
    ConsentStatus:
      type: string
      enum: [granted, withdrawn]
    ConsentChange:
      type: object
      description: One consent decision; `locale` is the language of the text the person saw.
      additionalProperties: false
      required: [purpose, status, policyVersion, surface, locale]
      properties:
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        status:
          $ref: '#/components/schemas/ConsentStatus'
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        surface:
          $ref: '#/components/schemas/ConsentSurface'
        locale:
          $ref: './platform.yaml#/components/schemas/Locale'
    ConsentRecord:
      type: object
      description: |
        One append-only consent record (doc 11 §7.1); `locale` is the language of the text the
        person saw.
      required: [id, purpose, status, policyVersion, surface, locale]
      properties:
        id:
          $ref: '#/components/schemas/ConsentRecordId'
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        status:
          $ref: '#/components/schemas/ConsentStatus'
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        grantedAt:
          type: string
          format: date-time
          description: When the consent was granted; present when `status` is `granted`.
        withdrawnAt:
          type: string
          format: date-time
          description: When the consent was withdrawn; present when `status` is `withdrawn`.
        surface:
          $ref: '#/components/schemas/ConsentSurface'
        locale:
          $ref: './platform.yaml#/components/schemas/Locale'
    ConsentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
    PolicyVersion:
      type: string
      description: Version of the policy text the person saw, e.g. `0.1.0-draft`.
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      maxLength: 64
      examples: ['0.1.0-draft']
    ConsentSurface:
      type: string
      description: Identifier of the app screen where the decision was made, e.g. `onboarding_consent`.
      pattern: '^[a-z][a-z0-9_]{0,63}$'
    DataExportId:
      type: string
      description: Data-export id, a prefixed ULID (`xpt_`, shared-kernel `ID_PREFIXES.exportRequest`).
      pattern: '^xpt_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: ['xpt_01J9Z3K8X2Q7N5V4B6C8D0E1F5']
    DataExportStatus:
      type: string
      description: |
        `in_progress` until the archive is built; then `ready` until `availableUntil`, when the
        archive is deleted and the export becomes `expired`. `failed` when it could not be
        built: nothing is kept, and the person may request a new export.
      enum: [in_progress, ready, failed, expired]
    DataExport:
      type: object
      description: |
        One data export of the caller (doc 11 §13.1): a ZIP archive of the caller's data in
        machine-readable JSON plus the media they uploaded. This object never carries archive
        content.
      required: [id, status, requestedAt]
      properties:
        id:
          $ref: '#/components/schemas/DataExportId'
        status:
          $ref: '#/components/schemas/DataExportStatus'
        requestedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          description: When the archive was built; present for `ready` and `expired`.
        availableUntil:
          type: string
          format: date-time
          description: |
            When the archive is deleted, 24 hours after `readyAt` (doc 11 §13.1); present for
            `ready` and `expired`. This is how long the archive is kept, not how long a link
            works: every read of a `ready` export mints a new link.
        download:
          $ref: '#/components/schemas/DataExportDownload'
    DataExportDownload:
      type: object
      description: Present only while the export is `ready`. Minted for this response; never stored by the server.
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: |
            Presigned GET of the archive, minted after the same authorization check as the
            export (doc 11 §13.1). It carries a live signature: never log, share or store it
            (doc 11 §8). Read the export again for a fresh link.
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working, at most 10 minutes after it was minted (DEC-44, doc 11 §5.4).
    DataExportInProgress:
      description: A problem (RFC 9457) that carries the running export when an export is already in progress.
      allOf:
        - $ref: './platform.yaml#/components/schemas/ProblemDetails'
        - type: object
          properties:
            current:
              $ref: '#/components/schemas/DataExport'
    AccountDeletionRequestId:
      type: string
      description: Account-deletion request id, a prefixed ULID (`del_`, shared-kernel `ID_PREFIXES.deletionRequest`).
      pattern: '^del_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: ['del_01J9Z3K8X2Q7N5V4B6C8D0E1F6']
    AccountDeletionRequest:
      type: object
      description: An accepted account-deletion request (doc 11 §13.2).
      required: [id, requestedAt, graceEndsAt]
      properties:
        id:
          $ref: '#/components/schemas/AccountDeletionRequestId'
        requestedAt:
          type: string
          format: date-time
        graceEndsAt:
          type: string
          format: date-time
          description: |
            End of the 7-day grace window (DEC-65). Until then a sign-in offers to cancel the
            deletion; after it the purge runs, and a cancel is refused with 410 `ACCOUNT_DELETED`.
