# `platform` module contract (docs/modules/platform.md): operational endpoints plus the shared
# RFC 9457 problem schema every module references. Included from ../openapi.yaml.
openapi: 3.1.0
info:
  title: AI Stylist API — platform
  version: 1.0.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [platform]
      summary: Liveness and dependency health
      description: Returns `ok` when the API and every checked dependency are reachable.
      security: []
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: One or more dependencies are down
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      operationId: getVersion
      tags: [platform]
      summary: Build identity of the running API
      description: Semantic version, commit SHA and build timestamp of the deployed API.
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    HealthReport:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties: false
          required: [db]
          properties:
            db:
              $ref: '#/components/schemas/HealthCheckStatus'
    HealthCheckStatus:
      type: string
      enum: [ok, down]
    VersionInfo:
      type: object
      additionalProperties: false
      required: [version, commit, builtAt]
      properties:
        version:
          type: string
          description: Semantic version of the deployed API
          examples: ['0.1.0']
        commit:
          type: string
          description: Git commit SHA the build was produced from
          examples: ['0123456789abcdef0123456789abcdef01234567']
        builtAt:
          type: string
          format: date-time
          description: RFC 3339 UTC build timestamp
    ProblemDetails:
      type: object
      description: RFC 9457 problem details (planning/06 §2). `code` is stable and machine-readable.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable machine code from the shared-kernel error registry
          pattern: '^[A-Z][A-Z0-9_]+$'
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Field-level validation failures with JSON-pointer paths
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      required: [pointer, message]
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON pointer into the request body
        message:
          type: string
        code:
          type: string
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
