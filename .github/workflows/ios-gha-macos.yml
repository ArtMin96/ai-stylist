# iOS lane B: GitHub-hosted macOS (P02-T14, candidate for ADR-0002 / OQ-04 - Proposed).
# Dispatch-only until the Apple account exists and ADR-0002 is Accepted.
# Runs alongside ios-eas.yml for ~2 weeks; the loser is deactivated in T15.
#
# Runner label: `macos-15` (arm64, M-series). Verified against
# actions/runner-images README on 2026-09-09: labels are `macos-15` /
# `macos-15-xlarge` (arm64) and `macos-15-large` / `macos-15-intel` (x64);
# `macos-latest` currently resolves to `macos-26`. macos-15 ships Xcode 26.x
# (26.3 at verification time), which satisfies the Xcode 26+ requirement
# (05 §7.1). Switch to `macos-26` if a newer default Xcode is needed.
#
# Required secrets: none for an unsigned preview build.
# Required for signing (signing step skipped when unset - NO Apple account yet):
#   IOS_DIST_CERT_P12_BASE64      distribution certificate (.p12, base64)
#   IOS_DIST_CERT_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64
#   APPLE_TEAM_ID
# TestFlight upload happens on Linux (see ios-eas.yml testflight-upload).
name: ios-gha-macos

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [dev, preview, prod]
        default: preview

permissions:
  contents: read

concurrency:
  group: ios-gha-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  DO_NOT_TRACK: '1'

jobs:
  build:
    name: just mobile-ios-build --cloud gha
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PROFILE: ${{ inputs.profile }}
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - name: Record start
        id: start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Xcode version
        run: xcodebuild -version

      - name: Import signing identity
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Standard ephemeral-keychain pattern from GitHub's own docs
          # (docs.github.com: "Installing an Apple certificate on macOS runners").
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          rm -f "$RUNNER_TEMP/dist.p12"
      - name: Signing status
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::iOS signing secrets not set - building unsigned (simulator/dev-client only)"

      - name: just mobile-ios-build --cloud gha --profile ${{ env.PROFILE }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: just mobile-ios-build --cloud gha --profile "$PROFILE"

      - name: Upload IPA / xcarchive
        uses: actions/upload-artifact@v7
        with:
          name: ios-gha-${{ env.PROFILE }}-${{ github.sha }}
          path: |
            apps/mobile/ios/build/**/*.ipa
            apps/mobile/build/**/*.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Record ci.ios_gha_build_duration_seconds (ADR-0002 data)
        if: always()
        run: |
          n=$(( $(date +%s) - ${{ steps.start.outputs.ts }} ))
          echo "ci.ios_gha_build_duration_seconds=${n} profile=${PROFILE} runner=macos-15 result=${{ job.status }}" | tee -a "$GITHUB_STEP_SUMMARY"
