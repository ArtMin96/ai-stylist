# THE version catalog for apps/android. Every dependency and plugin version lives here (Renovate's
# gradle manager bumps it; after a bump run the dependency-lock recipe to refresh
# gradle.lockfile + gradle/verification-metadata.xml). Never put a version string in a build script.

[versions]
agp = "9.3.3"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
activity = "1.13.0"
androidx-core = "1.19.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
retrofit = "3.0.0"
junit4 = "4.13.2"
robolectric = "4.17"
# The android-all jar Robolectric 4.17 loads for SDK 36 tests; bump together with robolectric.
robolectric-android-all = "16-robolectric-13921718-i7"
turbine = "1.2.1"
spotless = "8.10.2"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"
compose-lint-checks = "1.6.0"

# Security floors for BUILD-TOOL configurations only (never the app's runtime classpath): the
# patched versions of transitive dependencies that AGP's plugin classpath, Android Lint
# (`androidLintTool`), the Unified Test Platform (`unified-test-platform-*`) and Spotless's ktlint
# resolve at vulnerable versions. Applied as upgrade-only constraints by the root build script and
# build-logic (BuildToolSecurityFloors.kt). Drop an entry once its owning tool ships the fix.
# See docs/security/dependency-ignores.md (2026-09-23).
floor-bouncycastle = "1.85"
floor-commons-lang3 = "3.18.0"
floor-httpclient = "4.5.14"
floor-jose4j = "0.9.6"
floor-jdom2 = "2.0.6.1"
floor-netty = "4.1.137.Final"
floor-logback = "1.5.34"

# SDK levels (read by build-logic; see apps/android/README.md for why these values).
sdk-compile = "37"
sdk-target = "36"
sdk-min = "29"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
retrofit-converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android-all" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

compose-lint-checks = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "compose-lint-checks" }

# Security floors (see the floor-* versions above). Constraints only: none is ever a direct dependency.
floor-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "floor-bouncycastle" }
floor-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "floor-bouncycastle" }
floor-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "floor-bouncycastle" }
floor-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "floor-commons-lang3" }
floor-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "floor-httpclient" }
floor-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "floor-jose4j" }
floor-jdom2 = { module = "org.jdom:jdom2", version.ref = "floor-jdom2" }
floor-netty-bom = { module = "io.netty:netty-bom", version.ref = "floor-netty" }

# Build-logic (convention plugins) compile against these; not used by app modules directly.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

# Convention plugins from build-logic/ (no version: included build).
aistylist-android-application = { id = "aistylist.android.application" }
aistylist-android-library-compose = { id = "aistylist.android.library.compose" }
aistylist-jvm-library = { id = "aistylist.jvm.library" }
aistylist-jvm-generated = { id = "aistylist.jvm.generated" }
